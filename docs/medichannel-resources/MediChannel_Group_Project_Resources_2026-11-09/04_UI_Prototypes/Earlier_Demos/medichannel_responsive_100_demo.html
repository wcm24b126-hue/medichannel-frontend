<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediChannel • Mobile Demo</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#152b4b;background:#edf4fb}*{box-sizing:border-box}body{margin:0}.app{width:100%;max-width:1200px;margin:auto;min-height:100dvh;background:#f8fbff;padding-bottom:82px}header{background:linear-gradient(115deg,#083b80,#1678d4);color:white;padding:17px 16px 13px;position:sticky;top:0;z-index:3}header strong{font-size:20px}header small{display:block;opacity:.85}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.badge{font-size:11px;background:#d9f8e9;color:#086448;border-radius:20px;padding:5px 9px}main{padding:15px}h2{font-size:20px;margin:3px 0 12px}h3{font-size:15px;margin:0 0 9px}.card{background:#fff;border:1px solid #dce7f4;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #0a43800b}.muted{color:#60718a;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.btn{border:0;border-radius:10px;background:#1264ce;color:white;padding:11px 13px;font-weight:700;cursor:pointer;font-size:13px}.btn.alt{background:#e9f1fd;color:#1452a0}.btn.danger{background:#ce344a}.btn:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #cbd9ea;border-radius:9px;padding:10px;font:inherit;background:white;color:#1a3150}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}textarea{resize:vertical;min-height:75px}.pill{display:inline-block;background:#e7f1ff;color:#155cbd;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700}.error{color:#b4233e;font-size:12px}.success{color:#087a54;font-size:13px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1200px);background:white;border-top:1px solid #dce7f4;display:flex;justify-content:space-around;padding:9px 4px max(9px,env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:#51637e;font-size:11px;padding:5px 3px;cursor:pointer}.nav button.active{color:#095dca;font-weight:800}.notice{background:#e7f6ff;border-left:3px solid #1471d2;padding:10px;border-radius:7px;font-size:12px}.bubble{max-width:85%;padding:10px;border-radius:12px;background:#e8eff8;margin:7px 0;font-size:13px}.bubble.mine{background:#d5e8ff;margin-left:auto}.chatbox{height:180px;overflow:auto;background:#f4f8fd;padding:8px;border-radius:10px}.hidden{display:none}.mini{font-size:12px}.divider{height:1px;background:#e4ebf3;margin:12px 0}dialog{border:0;border-radius:15px;padding:20px;max-width:90%;width:340px}dialog::backdrop{background:#061c3d8c}@media(min-width:700px){.app{margin:25px auto;min-height:90vh;border-radius:20px;overflow:hidden;box-shadow:0 12px 45px #12427a22}.nav{bottom:0}}.app{min-width:0}main{width:100%;min-width:0}.card,.grid>*{min-width:0;overflow-wrap:anywhere}button,input,select,textarea{max-width:100%;min-width:0}input,select,textarea{font-size:16px}.nav{overflow-x:auto;gap:4px}.nav button{min-width:0;flex:1;min-height:42px}.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));gap:12px}.data-grid .card{margin:0}.search-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}.search-grid label{margin-top:2px}.data-count{font-size:12px;color:#526883;margin:8px 0}.card button{margin:3px 0}@media(min-width:700px){main{padding:26px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h2{font-size:26px}.nav button{font-size:13px}header{padding:18px 26px}}@media(max-width:380px){header{padding:12px}.top{flex-wrap:wrap}main{padding:10px}.grid{grid-template-columns:1fr}.nav button{font-size:10px;padding:6px 1px}.row{flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}} </style></head><body><div class="app"><header><div class="top"><div><strong>♡ MediChannel</strong><small>Hospital channelling • UI demo</small></div><span class="badge">● Demo mode</span></div><div class="row" style="margin-top:12px"><span style="font-size:12px">Preview as</span><select id="role" aria-label="Select role" style="width:170px;padding:7px" onchange="changeRole()"><option value="guest">Guest</option><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div></header><main id="screen"></main><nav class="nav" id="nav"></nav></div><dialog id="modal"><h3 id="modalTitle"></h3><p class="muted" id="modalText"></p><div class="row"><button class="btn alt" onclick="modal.close()">Back</button><button class="btn danger" id="modalYes">Confirm</button></div></dialog><script>
const $=id=>document.getElementById(id);const state={role:'guest',page:'home',booked:null,notifications:[['3 numbers away','Your appointment is approaching'],['Session delayed','A session time has changed']],chat:[['doctor','Hello, how can I help?']],ended:false,queue:24,sessionRunning:false,loginFails:0,firstLogin:false,available:5};// Exactly 100 fictional, deterministic demo session records; no backend required.
const specialties=['Cardiology','Dermatology','Neurology','Paediatrics','Orthopaedics','ENT','General Medicine','Ophthalmology','Psychiatry','Gynaecology'];
const firstNames=['Amara','Nimal','Sahan','Tharushi','Kavindi','Ruwan','Dilani','Kasun','Ishara','Malith'];
const demoSessions=Array.from({length:100},(_,i)=>({id:i+1,doctor:'Dr. '+firstNames[i%10]+' '+['Perera','Silva','Fernando','Jayasinghe','Wijesinghe'][Math.floor(i/10)%5],specialty:specialties[i%10],type:i%2?'Physical':'Online',date:'2026-11-'+String(10+Math.floor(i/10)).padStart(2,'0'),time:['09:00','11:00','14:00','16:00','18:00'][i%5],fee:1500+(i%5)*250,left:i%13===0?0:3+(i%12),room:'Room '+(1+i%12)}));
state.selectedSession=1;
function chooseSession(id){state.selectedSession=id;state.available=demoSessions[id-1].left;go('booking')}
function filterSessions(){const q=($('sessionQuery')?.value||'').toLowerCase().trim(),type=$('sessionType')?.value||'',date=$('sessionDate')?.value||'';const matches=demoSessions.filter(x=>(!q||(x.doctor+' '+x.specialty).toLowerCase().includes(q))&&(!type||x.type===type)&&(!date||x.date===date));$('resultsCount').textContent=matches.length+' of 100 preloaded fictional sessions';$('sessionResults').innerHTML=matches.length?matches.map(x=>card(safe(x.doctor)+' • '+safe(x.specialty),`<p class="muted">${x.date} • ${x.time} • ${x.type} • ${x.type==='Physical'?x.room:'Private chat'}</p><div class="row"><span class="pill">LKR ${x.fee.toLocaleString()}</span><strong>${x.left} left</strong></div><p>${button(x.left?'Select session':'Session full',x.left?(state.role==='guest'?"go('login')":`chooseSession(${x.id})`):'void(0)',x.left?'':'alt')}</p>`)).join(''):card('No matching sessions','Try a different name, date or type.');}
const menus={guest:[['home','Home'],['sessions','Sessions'],['login','Login']],patient:[['home','Home'],['sessions','Book'],['appointments','My visits'],['notifications','Alerts'],['profile','Profile']],doctor:[['home','Dashboard'],['queue','Queue'],['chat','Chat'],['records','Records']],manager:[['home','Dashboard'],['sessions','Sessions'],['reception','Reception'],['manage','Manage'],['reports','Reports']],admin:[['home','Dashboard'],['accounts','Accounts'],['audit','Audit']]};function changeRole(){state.role=$('role').value;state.page='home';render()}function go(p){state.page=p;render();window.scrollTo(0,0)}function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}function button(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(t,d){state.notifications.unshift([t,d]);alert(t);render()}function nav(){ $('nav').innerHTML=menus[state.role].map(([id,t])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')};function render(){nav();let r=state.role,p=state.page,h='';if(p==='home'){h=`<h2>${r==='guest'?'Find care, simply.':r==='patient'?'Patient dashboard':r==='doctor'?'Doctor dashboard':r==='manager'?'Manager dashboard':'Admin dashboard'}</h2>`;if(r==='guest')h+=card('Find a doctor',`<p class="muted">Search by doctor, date, speciality and session type.</p>${button('Explore sessions',"go('sessions')")}`)+card('Notices','<p class="mini">Hospital notices appear here.</p>');if(r==='patient')h+=`<div class="grid">${card('Book',button('Find session',"go('sessions')"))}${card('My appointments',button('View',"go('appointments')"))}${card('Live queue',`<strong>Now serving ${state.queue}</strong><p class="muted">Updates simulated</p>`)}${card('Notifications',button('View alerts',"go('notifications')"))}</div>`;if(r==='doctor')h+=card('Today’s session',`<p class="muted">Cardiology • 3:00 PM</p>${button(state.sessionRunning?'End session':'Start session','toggleSession()')}`)+card('Patient queue',button('Open queue',"go('queue')"))+card('Private consultation',button('Open chat',"go('chat')"));if(r==='manager')h+=card('Operations',`<div class="grid">${button('Reception',"go('reception')")}${button('Manage sessions',"go('sessions')")}${button('Notices & feedback',"go('manage')")}${button('Reports',"go('reports')")}</div>`)+`<p class="notice">Manager views exclude reasons for visit, medical notes, prescriptions and chat.</p>`;if(r==='admin')h+=card('System administration',`${button('Manage staff accounts',"go('accounts')")} ${button('Audit logs',"go('audit')",'alt')}`)+`<p class="notice">Admin views exclude all private consultation information.</p>`}
else if(p==='sessions'){h='<h2>Doctor sessions</h2>';if(r==='guest'||r==='patient')h+=card('Search 100 demo sessions',`<div class="search-grid"><div><label>Doctor / specialisation</label><input id="sessionQuery" placeholder="Search name or speciality" oninput="filterSessions()"></div><div><label>Session date</label><input id="sessionDate" type="date" onchange="filterSessions()"></div><div><label>Consultation type</label><select id="sessionType" onchange="filterSessions()"><option value="">All types</option><option>Physical</option><option>Online</option></select></div></div><p id="resultsCount" class="data-count">100 of 100 preloaded fictional sessions</p>`)+`<div id="sessionResults" class="data-grid"></div>`;else h+=card('Session actions',`${button('Delay session',"notify('Session delayed','Affected patients notified')",'alt')} ${button('Cancel session',"confirmAction('Cancel this session?', 'Affected patients will be notified.',()=>notify('Session cancelled','Affected patients notified'))",'danger')}<p class="muted">Create/edit session and room assignments are management actions.</p>`)}
else if(p==='login'){h='<h2>Sign in</h2>'+card('Login',`<label>Email</label><input id="email" type="email" placeholder="name@example.com"><label>Password</label><input id="password" type="password">${state.loginFails>=5?'<p class="error">Account locked for 15 minutes after 5 failed attempts (demo).</p>':''}<p>${button('Sign in',"login()")}</p><p class="mini">Demo: enter any email and password of 8+ characters, or use Register.</p>${button('Register',"go('register')",'alt')}`)}
else if(p==='register'){h='<h2>Create patient account</h2>'+card('Registration • BR-10',`<form id="reg" onsubmit="register(event)">${[['Full name','text'],['NIC','text'],['Date of birth','date'],['Gender','select'],['Phone','tel'],['Email','email'],['Address','text'],['Password','password']].map(([name,type],i)=>`<label>${name} *</label>${type==='select'?'<select required><option value="">Choose gender</option><option>Male</option><option>Female</option><option>Other</option></select>':`<input required type="${type}" ${type==='password'?'minlength="8"':''} ${name==='NIC'?'minlength="10"':''} placeholder="${name}">`}<div class="error" id="err${i}"></div>`).join('')}<p class="muted">Password needs a letter, number and symbol.</p><button class="btn" type="submit">Create account</button></form>`)}
else if(p==='booking'){h='<h2>Book appointment</h2>'+card('Session details',`<p>${safe(demoSessions[state.selectedSession-1].doctor)} • ${demoSessions[state.selectedSession-1].date} • ${demoSessions[state.selectedSession-1].time}</p><strong>${state.available} numbers left</strong><label>Consultation type</label><select id="type"><option value="Online">Online (private chat)</option><option value="Physical">Physical</option></select><label>Reason for visit *</label><textarea id="reason" maxlength="1000" placeholder="Describe your reason (visible only to your treating doctor)"></textarea><p id="bookError" class="error"></p>${button('Confirm booking',"book()")}`)}
else if(p==='confirmation'){h='<h2>Booking confirmed ✓</h2>'+card('Your appointment',`<p><strong>Appointment #${state.booked?.number}</strong></p><p>Booking reference: MC-DEMO-${state.booked?.number}</p><p>Estimated time: 3:15 PM</p><p>Type: ${state.booked?.type}</p><p>Room: ${state.booked?.type==='Physical'?'Room 03':'Not applicable (online)'}</p>${button('My appointments',"go('appointments')")}`)}
else if(p==='appointments'){h='<h2>My appointments</h2>'+(state.booked?card('Upcoming appointment',`<p>Dr. A. Perera • Wed, 11 Nov • 3:00 PM</p><p>Number ${state.booked.number} • ${state.booked.type} • <span class="pill">Unpaid</span></p><p>Now serving ${state.queue} • ${Math.max(0,state.booked.number-state.queue-1)} ahead</p>${button('View consultation',"go('chat')",'alt')} ${button('Cancel appointment',"cancelPrompt()",'danger')}`):card('No appointments',`<p class="muted">Nothing booked yet.</p>${button('Book now',"go('sessions')")}`))+card('After consultation',`${button('Summary & prescription',"go('summary')",'alt')} ${button('Give feedback',"go('feedback')",'alt')}`)}
else if(p==='notifications'){h='<h2>Notifications 🔔</h2>'+state.notifications.map(([a,b])=>card(safe(a),`<p class="muted">${safe(b)}</p>`)).join('')}
else if(p==='profile'){h='<h2>My profile</h2>'+card('Profile management',`<label>Full name</label><input value="Demo Patient"><label>Phone</label><input value="0771234567"><label>Address</label><input value="Colombo"><p>${button('Save changes',"notify('Profile updated','Demo profile saved')")}</p>`)}
else if(p==='summary'){h='<h2>Consultation summary</h2>'+card('Visit summary & prescription',`<p class="muted">Only the patient and treating doctor can access these medical details.</p><p>Diagnosis: Demo consultation note</p><p>Advice: Follow the doctor’s instructions.</p><p>Prescription: Sample only — not medical advice.</p>${button('Print', 'window.print()')}`)}
else if(p==='feedback'){h='<h2>Give feedback</h2>'+card('Rate your experience',`<label>Rating</label><select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Comment</label><textarea id="feedback"></textarea><p>${button('Submit once',"notify('Feedback submitted','Demo feedback recorded')")}</p>`)}
else if(p==='queue'){h='<h2>Patient queue</h2>'+card('Live queue • Cardiology',`<p>Now serving <strong>${state.queue}</strong></p><p>Patient #${state.queue+1} • Reason: Fever (doctor-only view)</p>${button('Call next',"nextPatient()")}`)+card('Patient actions',`${button('Mark completed',"notify('Completed','Patient marked completed')")}${button('Mark no-show',"notify('No-show','Patient marked no-show')",'alt')}`)}
else if(p==='chat'){h='<h2>Private consultation chat</h2>'+card('RT-03 • BR-09',`<div class="row"><span class="pill">${state.ended?'● Ended • read-only':'● Connected'}</span><span class="muted">Encrypted messages (production requirement)</span></div><div class="chatbox">${state.chat.map(([who,msg])=>`<div class="bubble ${who==='me'?'mine':''}">${safe(msg)}</div>`).join('')}</div>${state.ended?'<p class="muted">Consultation ended. Chat is read-only.</p>':`<p class="muted">Doctor is typing…</p><textarea id="message" maxlength="1000" placeholder="Write a message (max 1000 characters)"></textarea><div class="row"><small id="count">0 / 1000</small>${button('Send',"sendChat()")}</div>`}${state.role==='doctor'&&!state.ended?`<p>${button('End consultation',"endChat()",'danger')}</p>`:''}`);setTimeout(()=>{if($('message'))$('message').oninput=e=>$('count').textContent=e.target.value.length+' / 1000'},0)}
else if(p==='records'){h='<h2>Doctor notes & prescription</h2>'+card('Private medical record',`<label>Diagnosis / notes</label><textarea placeholder="Consultation notes"></textarea><label>Prescription</label><textarea placeholder="Prescription details"></textarea>${button('Save record',"notify('Record saved','Demo only')")}`)}
else if(p==='reception'){h='<h2>Reception</h2>'+card('Check in / walk-in',`<label>Patient reference</label><input placeholder="Patient ID or booking reference"><p>${button('Check in',"notify('Checked in','Reception updated')")}</p>${button('Book walk-in patient',"notify('Walk-in booking','Demo booking created')",'alt')}`)+card('Record payment',`${button('Record payment',"notify('Payment recorded','Demo only')")}`)}
else if(p==='manage'){h='<h2>Notices & feedback</h2>'+card('Notices',`${button('Publish notice',"notify('Notice published','Visible to patients')")}`)+card('Feedback moderation',`${button('Approve',"notify('Approved','Feedback visible')")}${button('Hide',"notify('Hidden','Feedback hidden')",'alt')}${button('Delete',"confirmAction('Delete feedback?','This demo will hide the item.',()=>notify('Deleted','Feedback removed'))",'danger')}`)}
else if(p==='reports'){h='<h2>Manager reports</h2>'+card('Operations snapshot','<p>No-show rate: 8% (illustrative)</p><p>Revenue: LKR 42,000 (illustrative)</p><p>Top doctors: Dr. A. Perera (illustrative)</p>')}
else if(p==='accounts'){h='<h2>Staff accounts</h2>'+card('Manage users',`<p>Admin (current account) ${button('Deactivate self',"",'danger').replace('<button','<button disabled')}</p><p>Doctor account ${button('Deactivate',"notify('Account deactivated','Status changed')",'alt')}</p>${button('Reset staff password',"resetPassword()")}`)}
else if(p==='audit'){h='<h2>Audit log</h2>'+card('Recent activity','<p>10:32 • Session updated</p><p>10:24 • Staff account created</p><p class="muted">No private medical data displayed.</p>')}
else if(p==='passwordChange'){h='<h2>Password change required</h2>'+card('First login after reset',`<p class="error">You must change your password before continuing.</p><label>New password</label><input id="newpw" type="password"><p>${button('Update password',"finishPassword()")}</p>`)}$('screen').innerHTML=h;if(p==='sessions'&&(r==='guest'||r==='patient'))filterSessions()}
function login(){let pw=$('password').value;if(state.loginFails>=5)return; if(!$('email').value.includes('@')||pw.length<8){state.loginFails++;render();alert('Invalid email or password');return}state.role='patient';$('role').value='patient';go('home')}
function register(e){e.preventDefault();let fields=[...$('reg').querySelectorAll('input,select')],pw=fields.at(-1).value;if(!/(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}/.test(pw)){$('err7').textContent='Use 8+ characters with a letter, number and symbol.';return}state.role='patient';$('role').value='patient';go('home')}
function book(){let reason=$('reason').value.trim();if(!reason){$('bookError').textContent='Reason for visit is required.';return}if(state.available<1){$('bookError').textContent='Session full';return}state.booked={number:27,type:$('type').value,sessionId:state.selectedSession};state.available--;demoSessions[state.selectedSession-1].left--;go('confirmation')}
function confirmAction(title,txt,yes){$('modalTitle').textContent=title;$('modalText').textContent=txt;$('modalYes').onclick=()=>{modal.close();yes()};modal.showModal()}
function cancelPrompt(){if(!state.booked)return;confirmAction('Cancel appointment?','BR-07: Allowed only when unpaid and at least 3 hours before the session. This demo assumes both conditions are satisfied.',()=>{state.booked=null;state.available++;demoSessions[state.selectedSession-1].left++;notify('Appointment cancelled','Your appointment was cancelled')})}
function toggleSession(){state.sessionRunning=!state.sessionRunning;render()}function nextPatient(){state.queue++;render()}function sendChat(){let msg=$('message').value.trim();if(!msg||state.ended)return;state.chat.push(['me',msg]);render()}function endChat(){state.ended=true;render()}function resetPassword(){state.firstLogin=true;notify('Password reset','Staff member must change password at next login');go('passwordChange')}function finishPassword(){if($('newpw').value.length<8){alert('Use a stronger password');return}state.firstLogin=false;go('home')};render();
</script></body></html>
